<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BATTLE ROYALE</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,"Noto Sans JP",sans-serif;
  background:#101722;
  color:white;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
  position:fixed;
  inset:0;
  z-index:10000;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 30%,#4c9fe8,#10263d 65%,#071018);
}

.loginBox{
  width:390px;
  padding:38px;
  border-radius:24px;
  background:rgba(5,15,25,.92);
  box-shadow:0 25px 80px rgba(0,0,0,.55);
  text-align:center;
}

.logo{
  font-size:42px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:8px;
}

.logoSub{
  color:#b9c7d8;
  margin-bottom:30px;
}

.input{
  width:100%;
  padding:15px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #43546a;
  background:#101c29;
  color:white;
  font-size:16px;
  outline:none;
}

.primary{
  width:100%;
  padding:16px;
  margin-top:15px;
  border-radius:12px;
  background:linear-gradient(135deg,#36e66f,#159a4a);
  color:white;
  font-size:20px;
  font-weight:bold;
  box-shadow:0 8px 25px rgba(22,200,90,.25);
}

.primary:hover{
  filter:brightness(1.15);
  transform:translateY(-1px);
}

.loginInfo{
  margin-top:18px;
  color:#91a4b8;
  font-size:13px;
}

/* =========================
   APP
========================= */

#app{
  position:fixed;
  inset:0;
}

#gameCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  z-index:1;
  background:#65b9e9;
}

/* =========================
   TOP NAV
========================= */

#topNav{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:100;
  display:flex;
  gap:8px;
  padding:8px;
  border-radius:16px;
  background:rgba(8,17,27,.72);
  backdrop-filter:blur(10px);
}

.navButton{
  color:white;
  padding:12px 20px;
  border-radius:11px;
  background:rgba(255,255,255,.08);
  font-weight:bold;
}

.navButton:hover{
  background:rgba(255,255,255,.18);
}

.navButton.active{
  background:#2878dd;
}

/* =========================
   ACCOUNT
========================= */

#account{
  position:absolute;
  top:20px;
  right:20px;
  z-index:100;
  display:flex;
  align-items:center;
  gap:10px;
}

.userName{
  padding:12px 16px;
  border-radius:12px;
  background:rgba(5,15,25,.78);
  font-weight:bold;
}

.logout{
  padding:12px 15px;
  border-radius:10px;
  background:#e83f52;
  color:white;
  font-weight:bold;
}

/* =========================
   LOBBY
========================= */

#lobbyPanel{
  position:absolute;
  left:35px;
  bottom:35px;
  z-index:100;
  width:430px;
}

.lobbyTitle{
  font-size:52px;
  font-weight:900;
  text-shadow:0 5px 20px rgba(0,0,0,.5);
}

.lobbySubtitle{
  margin:5px 0 20px;
  color:#d8e8f5;
}

.playButton{
  width:300px;
  padding:20px;
  border-radius:15px;
  background:linear-gradient(135deg,#32ef6d,#079b47);
  color:white;
  font-size:30px;
  font-weight:900;
  box-shadow:0 10px 35px rgba(0,0,0,.4);
  position:relative;
  z-index:1000;
  pointer-events:auto;
}

.playButton:hover{
  transform:scale(1.03);
  filter:brightness(1.1);
}

.playButton:active{
  transform:scale(.98);
}

.modeInfo{
  margin-top:15px;
  padding:14px 18px;
  width:300px;
  border-radius:13px;
  background:rgba(5,15,25,.72);
}

/* =========================
   HP / HUD
========================= */

#hud{
  position:absolute;
  inset:0;
  z-index:50;
  pointer-events:none;
}

.hpBox{
  position:absolute;
  left:22px;
  top:22px;
  width:415px;
  padding:18px 22px;
  border-radius:18px;
  background:rgba(4,16,27,.82);
  box-shadow:0 10px 35px rgba(0,0,0,.3);
}

.hpText{
  font-size:24px;
  font-weight:bold;
  margin-bottom:10px;
}

.hpBar{
  width:100%;
  height:16px;
  border-radius:20px;
  overflow:hidden;
  background:#151515;
  border:2px solid white;
}

#hpFill{
  height:100%;
  width:100%;
  background:#25df70;
}

#stormBox{
  position:absolute;
  top:24px;
  left:50%;
  transform:translateX(-50%);
  padding:15px 25px;
  border-radius:15px;
  background:#3c1687;
  font-size:20px;
  font-weight:bold;
}

#playersBox{
  position:absolute;
  right:22px;
  top:22px;
  padding:17px 25px;
  border-radius:18px;
  background:rgba(4,16,27,.82);
  font-size:22px;
  font-weight:bold;
}

#weaponBox{
  position:absolute;
  right:25px;
  bottom:25px;
  width:245px;
  padding:20px;
  border-radius:18px;
  background:rgba(4,16,27,.88);
  text-align:center;
}

.weaponName{
  font-size:25px;
  font-weight:bold;
}

.ammo{
  margin-top:7px;
  font-size:22px;
}

/* =========================
   CONTROLS
========================= */

#controls{
  position:absolute;
  left:22px;
  bottom:22px;
  padding:18px;
  border-radius:15px;
  background:rgba(4,16,27,.84);
  line-height:1.65;
  font-size:15px;
}

/* =========================
   CROSSHAIR
========================= */

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:70;
  width:30px;
  height:30px;
  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
  box-shadow:0 0 3px black;
}

#crosshair:before{
  width:30px;
  height:2px;
  top:14px;
}

#crosshair:after{
  width:2px;
  height:30px;
  left:14px;
}

/* =========================
   MODAL
========================= */

#modal{
  position:absolute;
  inset:0;
  z-index:500;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.65);
}

.modalBox{
  width:min(850px,90vw);
  max-height:80vh;
  overflow:auto;
  padding:30px;
  border-radius:22px;
  background:#101c2a;
  box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.modalHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.modalHeader h2{
  margin:0;
  font-size:30px;
}

.closeButton{
  padding:10px 15px;
  border-radius:10px;
  background:#26384b;
  color:white;
}

.shopGrid,
.lockerGrid,
.newsGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.card{
  min-height:150px;
  padding:20px;
  border-radius:16px;
  background:#18283a;
  border:1px solid #2c4259;
}

.card h3{
  margin-top:0;
}

.buyButton{
  padding:10px 15px;
  border-radius:9px;
  background:#2878dd;
  color:white;
  font-weight:bold;
}

.newsImage{
  height:100px;
  border-radius:10px;
  margin-bottom:10px;
  background:linear-gradient(135deg,#2878dd,#7928dd);
}

/* =========================
   RESULT
========================= */

#resultScreen{
  position:absolute;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(4,10,16,.88);
}

.resultBox{
  width:500px;
  padding:45px;
  text-align:center;
  border-radius:25px;
  background:#122132;
}

.resultTitle{
  font-size:48px;
  font-weight:900;
}

.resultButton{
  margin-top:25px;
  width:100%;
  padding:16px;
  border-radius:12px;
  background:#2878dd;
  color:white;
  font-size:20px;
  font-weight:bold;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .shopGrid,
  .lockerGrid,
  .newsGrid{
    grid-template-columns:1fr;
  }

  #topNav{
    width:96%;
    justify-content:center;
  }

  .navButton{
    padding:9px;
    font-size:12px;
  }

  .hpBox{
    width:260px;
  }

  #lobbyPanel{
    left:18px;
    bottom:18px;
  }

  .lobbyTitle{
    font-size:35px;
  }

}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen">

  <div class="loginBox">

    <div class="logo">
      BATTLE ROYALE
    </div>

    <div class="logoSub">
      OFFLINE EDITION
    </div>

    <input id="loginName"
           class="input"
           placeholder="プレイヤー名"
           value="Mario">

    <input id="loginPassword"
           class="input"
           type="password"
           placeholder="パスワード"
           value="1234">

    <button id="loginButton" class="primary">
      ログイン
    </button>

    <div class="loginInfo">
      このバージョンはオフラインで動作します。
    </div>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="hidden">

  <canvas id="gameCanvas"></canvas>

  <!-- TOP NAV -->

  <div id="topNav">

    <button class="navButton active" data-panel="lobby">
      🏠 ロビー
    </button>

    <button class="navButton" data-panel="shop">
      🛒 ショップ
    </button>

    <button class="navButton" data-panel="locker">
      🎒 ロッカー
    </button>

    <button class="navButton" data-panel="news">
      📰 ニュース
    </button>

  </div>


  <!-- ACCOUNT -->

  <div id="account">

    <div id="userName" class="userName">
      Mario
    </div>

    <button id="logoutButton" class="logout">
      ログアウト
    </button>

  </div>


  <!-- LOBBY -->

  <div id="lobbyPanel">

    <div class="lobbyTitle">
      BATTLE ROYALE
    </div>

    <div class="lobbySubtitle">
      最後まで生き残れ。
    </div>

    <!-- PLAYを確実にクリックできるように独立 -->
    <button id="playButton" class="playButton">
      ▶ PLAY
    </button>

    <div class="modeInfo">
      🎮 バトルロイヤル<br>
      🧱 建築あり<br>
      👥 最大100人
    </div>

  </div>


  <!-- HUD -->

  <div id="hud" class="hidden">

    <div class="hpBox">

      <div id="hpText" class="hpText">
        ❤️ HP 100 / 100
      </div>

      <div class="hpBar">
        <div id="hpFill"></div>
      </div>

    </div>

    <div id="stormBox">
      🌀 ストームまで 90秒
    </div>

    <div id="playersBox">
      👥 残り 10
    </div>

    <div id="weaponBox">

      <div class="weaponName">
        🔫 RIFLE
      </div>

      <div id="ammoText" class="ammo">
        30 / 120
      </div>

    </div>

    <div id="controls">

      <b>操作</b><br>
      WASD：移動<br>
      SHIFT：ダッシュ<br>
      SPACE：ジャンプ<br>
      左クリック：射撃<br>
      R：リロード<br>
      1：ライフル<br>
      2：ショットガン<br>
      B：建築<br>
      E：アイテム取得<br>
      ESC：ロビー<br>
      🎮 右スティック：カメラ

    </div>

  </div>


  <div id="crosshair" class="hidden"></div>


  <!-- MODAL -->

  <div id="modal" class="hidden">

    <div class="modalBox">

      <div class="modalHeader">

        <h2 id="modalTitle">
          ショップ
        </h2>

        <button id="closeModal" class="closeButton">
          ✕ 閉じる
        </button>

      </div>

      <div id="modalContent"></div>

    </div>

  </div>


  <!-- RESULT -->

  <div id="resultScreen" class="hidden">

    <div class="resultBox">

      <div class="resultTitle">
        🏆 VICTORY!
      </div>

      <p>
        あなたは最後まで生き残った！
      </p>

      <button id="returnLobby" class="resultButton">
        🔄 ロビーへ戻る
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   BASIC
========================================================= */

const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const canvas =
  document.getElementById("gameCanvas");

const ctx =
  canvas.getContext("2d");

let playerName = "Mario";

let gameMode = false;

let gameRunning = false;


/* =========================================================
   RESIZE
========================================================= */

function resize(){

  canvas.width =
    window.innerWidth * devicePixelRatio;

  canvas.height =
    window.innerHeight * devicePixelRatio;

  canvas.style.width =
    window.innerWidth + "px";

  canvas.style.height =
    window.innerHeight + "px";

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );
}

window.addEventListener("resize",resize);

resize();


/* =========================================================
   LOGIN
========================================================= */

document
  .getElementById("loginButton")
  .addEventListener("click",function(){

    const name =
      document.getElementById("loginName").value.trim();

    if(name){
      playerName = name;
    }

    document
      .getElementById("userName")
      .textContent = playerName;

    loginScreen.classList.add("hidden");
    app.classList.remove("hidden");

    showLobby();

  });


document
  .getElementById("logoutButton")
  .addEventListener("click",function(){

    gameMode = false;
    gameRunning = false;

    document
      .getElementById("hud")
      .classList.add("hidden");

    document
      .getElementById("crosshair")
      .classList.add("hidden");

    loginScreen.classList.remove("hidden");

  });


/* =========================================================
   NAV
========================================================= */

document
  .querySelectorAll(".navButton")
  .forEach(button=>{

    button.addEventListener("click",function(){

      const panel =
        this.dataset.panel;

      document
        .querySelectorAll(".navButton")
        .forEach(b=>b.classList.remove("active"));

      this.classList.add("active");

      if(panel==="lobby"){
        closeModal();
        showLobby();
      }

      if(panel==="shop"){
        openShop();
      }

      if(panel==="locker"){
        openLocker();
      }

      if(panel==="news"){
        openNews();
      }

    });

  });


/* =========================================================
   LOBBY
========================================================= */

function showLobby(){

  gameMode = false;
  gameRunning = false;

  document
    .getElementById("lobbyPanel")
    .classList.remove("hidden");

  document
    .getElementById("hud")
    .classList.add("hidden");

  document
    .getElementById("crosshair")
    .classList.add("hidden");

  document
    .getElementById("resultScreen")
    .classList.add("hidden");

}


/* =========================================================
   PLAY
========================================================= */

/*
   重要：
   PLAYボタンに直接clickイベントを付ける。
   canvasは下にあるのでボタンがクリックを奪われない。
*/

document
  .getElementById("playButton")
  .addEventListener("click",function(e){

    e.preventDefault();
    e.stopPropagation();

    startGame();

  });


function startGame(){

  gameMode = true;
  gameRunning = true;

  document
    .getElementById("lobbyPanel")
    .classList.add("hidden");

  document
    .getElementById("hud")
    .classList.remove("hidden");

  document
    .getElementById("crosshair")
    .classList.remove("hidden");

  closeModal();

  resetGame();

}


/* =========================================================
   MODALS
========================================================= */

const modal =
  document.getElementById("modal");

const modalTitle =
  document.getElementById("modalTitle");

const modalContent =
  document.getElementById("modalContent");


function openModal(title,html){

  modalTitle.textContent = title;
  modalContent.innerHTML = html;

  modal.classList.remove("hidden");

}


function closeModal(){

  modal.classList.add("hidden");

}


document
  .getElementById("closeModal")
  .addEventListener("click",closeModal);


/* SHOP */

function openShop(){

  gameMode = false;
  gameRunning = false;

  document
    .getElementById("lobbyPanel")
    .classList.remove("hidden");

  openModal(
    "🛒 ショップ",
    `
      <div class="shopGrid">

        <div class="card">
          <h3>🔫 GOLD RIFLE</h3>
          <p>レアリティ：LEGENDARY</p>
          <p>コイン：1200</p>
          <button class="buyButton">購入</button>
        </div>

        <div class="card">
          <h3>⚔️ SHADOW</h3>
          <p>レアリティ：EPIC</p>
          <p>コイン：800</p>
          <button class="buyButton">購入</button>
        </div>

        <div class="card">
          <h3>🛡️ GUARDIAN</h3>
          <p>レアリティ：RARE</p>
          <p>コイン：500</p>
          <button class="buyButton">購入</button>
        </div>

      </div>
    `
  );

}


/* LOCKER */

function openLocker(){

  gameMode = false;
  gameRunning = false;

  openModal(
    "🎒 ロッカー",
    `
      <div class="lockerGrid">

        <div class="card">
          <h3>🧍 スキン</h3>
          <p>BLUE WARRIOR</p>
          <button class="buyButton">装備</button>
        </div>

        <div class="card">
          <h3>⛏️ ツルハシ</h3>
          <p>STANDARD PICKAXE</p>
          <button class="buyButton">装備</button>
        </div>

        <div class="card">
          <h3>🪂 グライダー</h3>
          <p>SKY GLIDER</p>
          <button class="buyButton">装備</button>
        </div>

      </div>
    `
  );

}


/* NEWS */

function openNews(){

  gameMode = false;
  gameRunning = false;

  openModal(
    "📰 ニュース",
    `
      <div class="newsGrid">

        <div class="card">
          <div class="newsImage"></div>
          <h3>🔥 SEASON 2 開幕</h3>
          <p>新しい島が登場しました。</p>
        </div>

        <div class="card">
          <div class="newsImage"></div>
          <h3>⚔️ 新武器追加</h3>
          <p>新しいライフルが追加されました。</p>
        </div>

        <div class="card">
          <div class="newsImage"></div>
          <h3>🌪️ ストーム変更</h3>
          <p>ストームの速度が変更されました。</p>
        </div>

      </div>
    `
  );

}


/* =========================================================
   GAME
========================================================= */

let player = {
  x:0,
  y:0,
  z:0,
  vx:0,
  vz:0,
  vy:0,
  rot:0,
  hp:100
};

let camera = {
  x:0,
  y:0,
  rot:0
};

let keys = {};

let bullets = [];

let enemies = [];

let buildings = [];

let items = [];

let ammo = 30;

let reserveAmmo = 120;

let stormTime = 90;

let remaining = 10;


/* =========================================================
   RESET
========================================================= */

function resetGame(){

  player = {
    x:0,
    y:0,
    z:0,
    vx:0,
    vz:0,
    vy:0,
    rot:0,
    hp:100
  };

  camera = {
    x:0,
    y:0,
    rot:0
  };

  ammo = 30;
  reserveAmmo = 120;
  stormTime = 90;
  remaining = 10;

  buildings = [];

  bullets = [];

  enemies = [];

  items = [];

  for(let i=0;i<8;i++){

    enemies.push({
      x:(Math.random()-.5)*1500,
      z:(Math.random()-.5)*1500,
      hp:100,
      color:i%2 ? "#db3d3d":"#e7c08b"
    });

  }

  for(let i=0;i<12;i++){

    items.push({
      x:(Math.random()-.5)*1500,
      z:(Math.random()-.5)*1500,
      type:i%2 ? "ammo":"med"
    });

  }

}


/* =========================================================
   INPUT
========================================================= */

window.addEventListener("keydown",e=>{

  keys[e.code]=true;

  if(e.code==="Escape"){

    if(gameMode){
      showLobby();
    }else{
      closeModal();
    }

  }

  if(!gameMode) return;

  if(e.code==="KeyR"){
    reload();
  }

  if(e.code==="KeyB"){
    build();
  }

  if(e.code==="Digit1"){
    document.querySelector(".weaponName").textContent =
      "🔫 RIFLE";
  }

  if(e.code==="Digit2"){
    document.querySelector(".weaponName").textContent =
      "💥 SHOTGUN";
  }

});


window.addEventListener("keyup",e=>{
  keys[e.code]=false;
});


canvas.addEventListener("mousedown",e=>{

  if(!gameMode) return;

  if(e.button===0){
    shoot();
  }

});


/* =========================================================
   RELOAD
========================================================= */

function reload(){

  const need = 30-ammo;

  if(need<=0) return;

  const amount =
    Math.min(need,reserveAmmo);

  ammo += amount;
  reserveAmmo -= amount;

  updateHUD();

}


/* =========================================================
   SHOOT
========================================================= */

function shoot(){

  if(ammo<=0){
    reload();
    return;
  }

  ammo--;

  bullets.push({

    x:player.x,
    z:player.z,

    vx:Math.sin(player.rot)*18,
    vz:Math.cos(player.rot)*18,

    life:70

  });

  updateHUD();

}


/* =========================================================
   BUILD
========================================================= */

function build(){

  if(!gameMode) return;

  const distance=100;

  buildings.push({

    x:player.x +
      Math.sin(player.rot)*distance,

    z:player.z +
      Math.cos(player.rot)*distance,

    rot:player.rot

  });

}


/* =========================================================
   MOVEMENT
========================================================= */

function updatePlayer(){

  let forward=0;
  let strafe=0;

  if(keys["KeyW"]) forward+=1;
  if(keys["KeyS"]) forward-=1;
  if(keys["KeyA"]) strafe-=1;
  if(keys["KeyD"]) strafe+=1;

  const sprint =
    keys["ShiftLeft"] ||
    keys["ShiftRight"];

  const speed =
    sprint ? 11 : 6;

  const sin=Math.sin(player.rot);
  const cos=Math.cos(player.rot);

  player.vx =
    (sin*forward + cos*strafe)*speed;

  player.vz =
    (cos*forward - sin*strafe)*speed;

  player.x += player.vx;
  player.z += player.vz;

  if(keys["Space"] && player.y<=0){
    player.vy=12;
  }

  player.vy -= .6;

  player.y += player.vy;

  if(player.y<0){
    player.y=0;
    player.vy=0;
  }

}


/* =========================================================
   GAMEPAD
========================================================= */

function updateGamepad(){

  const pads =
    navigator.getGamepads ?
    navigator.getGamepads() : [];

  const pad=pads[0];

  if(!pad) return;

  const lx=pad.axes[0]||0;
  const ly=pad.axes[1]||0;

  if(Math.abs(lx)>.15 ||
     Math.abs(ly)>.15){

    const sin=Math.sin(player.rot);
    const cos=Math.cos(player.rot);

    player.x +=
      (sin*(-ly)+cos*lx)*5;

    player.z +=
      (cos*(-ly)-sin*lx)*5;

  }

  const rx=pad.axes[2]||0;

  if(Math.abs(rx)>.12){
    player.rot += rx*.055;
  }

  if(pad.buttons[0]?.pressed &&
     player.y<=0){
    player.vy=12;
  }

  if(pad.buttons[5]?.pressed){
    shoot();
  }

}


/* =========================================================
   ENEMIES
========================================================= */

function updateEnemies(){

  enemies.forEach(enemy=>{

    const dx=player.x-enemy.x;
    const dz=player.z-enemy.z;

    const dist=Math.sqrt(dx*dx+dz*dz);

    if(dist<600 && dist>45){

      enemy.x +=
        dx/dist*.7;

      enemy.z +=
        dz/dist*.7;

    }

    if(dist<55){

      player.hp -= .08;

      if(player.hp<0){
        player.hp=0;
      }

    }

  });

  if(Math.random()<.002 && remaining>1){
    remaining--;
  }

}


/* =========================================================
   BULLETS
========================================================= */

function updateBullets(){

  bullets.forEach(b=>{

    b.x += b.vx;
    b.z += b.vz;

    b.life--;

    enemies.forEach(enemy=>{

      const dx=b.x-enemy.x;
      const dz=b.z-enemy.z;

      const d=Math.sqrt(dx*dx+dz*dz);

      if(d<35){

        enemy.hp-=40;

        b.life=0;

      }

    });

  });

  bullets =
    bullets.filter(b=>b.life>0);

  enemies =
    enemies.filter(e=>e.hp>0);

}


/* =========================================================
   ITEMS
========================================================= */

function updateItems(){

  if(!keys["KeyE"]) return;

  items =
    items.filter(item=>{

      const dx=item.x-player.x;
      const dz=item.z-player.z;

      const d=Math.sqrt(dx*dx+dz*dz);

      if(d<70){

        if(item.type==="med"){

          player.hp =
            Math.min(100,player.hp+25);

        }else{

          reserveAmmo+=30;

        }

        return false;

      }

      return true;

    });

}


/* =========================================================
   STORM
========================================================= */

function updateStorm(){

  if(!gameMode) return;

  stormTime -= 1/60;

  if(stormTime<0){
    stormTime=90;
  }

  const distance =
    Math.sqrt(
      player.x*player.x+
      player.z*player.z
    );

  if(distance>1100){

    player.hp-=.15;

  }

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  const hp =
    Math.max(0,Math.round(player.hp));

  document
    .getElementById("hpText")
    .textContent =
      "❤️ HP " + hp + " / 100";

  document
    .getElementById("hpFill")
    .style.width =
      hp + "%";

  document
    .getElementById("ammoText")
    .textContent =
      ammo + " / " + reserveAmmo;

  document
    .getElementById("playersBox")
    .textContent =
      "👥 残り " + Math.max(1,remaining);

  document
    .getElementById("stormBox")
    .textContent =
      "🌀 ストームまで " +
      Math.ceil(stormTime) +
      "秒";

}


/* =========================================================
   SIMPLE 3D RENDERER
========================================================= */

function project(x,z,y=0){

  const dx=x-player.x;
  const dz=z-player.z;

  const sin=Math.sin(-player.rot);
  const cos=Math.cos(-player.rot);

  const rx =
    dx*cos-dz*sin;

  const rz =
    dx*sin+dz*cos;

  if(rz<=2) return null;

  const fov=650;

  const scale=
    fov/rz;

  return {

    x:
      window.innerWidth/2+
      rx*scale,

    y:
      window.innerHeight/2+
      (player.y-y)*scale,

    scale

  };

}


function drawSky(){

  const w=window.innerWidth;
  const h=window.innerHeight;

  const sky=
    ctx.createLinearGradient(
      0,0,0,h
    );

  sky.addColorStop(0,"#54b4e8");
  sky.addColorStop(.55,"#a8dcf4");
  sky.addColorStop(.56,"#5fae45");
  sky.addColorStop(1,"#286c2c");

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,w,h);

}


function drawGround(){

  const w=window.innerWidth;
  const h=window.innerHeight;

  ctx.fillStyle="#398b35";

  ctx.fillRect(
    0,
    h*.52,
    w,
    h*.48
  );

  /* road */

  ctx.fillStyle="#303942";

  ctx.beginPath();

  ctx.moveTo(w*.37,h);
  ctx.lineTo(w*.63,h);
  ctx.lineTo(w*.54,h*.52);
  ctx.lineTo(w*.46,h*.52);
  ctx.closePath();

  ctx.fill();

}


function drawTree(x,z){

  const p=project(x,z,0);

  if(!p) return;

  const s=
    Math.max(10,Math.min(180,p.scale*8));

  ctx.fillStyle="#4b2d19";

  ctx.fillRect(
    p.x-s*.15,
    p.y-s*2,
    s*.3,
    s*2
  );

  ctx.fillStyle="#075b2c";

  ctx.beginPath();

  ctx.moveTo(
    p.x,
    p.y-s*7
  );

  ctx.lineTo(
    p.x-s*2,
    p.y-s*2
  );

  ctx.lineTo(
    p.x+s*2,
    p.y-s*2
  );

  ctx.closePath();

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(
    p.x,
    p.y-s*5
  );

  ctx.lineTo(
    p.x-s*1.6,
    p.y-s
  );

  ctx.lineTo(
    p.x+s*1.6,
    p.y-s
  );

  ctx.closePath();

  ctx.fill();

}


function drawBuilding(x,z,rot=0){

  const p=project(x,z,0);

  if(!p) return;

  const s=
    Math.max(20,Math.min(220,p.scale*12));

  ctx.save();

  ctx.translate(p.x,p.y);

  ctx.fillStyle="#8d5b3d";

  ctx.fillRect(
    -s,
    -s*2,
    s*2,
    s*2
  );

  ctx.fillStyle="#57351f";

  ctx.beginPath();

  ctx.moveTo(-s*1.1,-s*2);
  ctx.lineTo(0,-s*3);
  ctx.lineTo(s*1.1,-s*2);
  ctx.closePath();

  ctx.fill();

  ctx.fillStyle="#241912";

  ctx.fillRect(
    -s*.18,
    -s*.8,
    s*.36,
    s*.8
  );

  ctx.restore();

}


function drawEnemy(enemy){

  const p=project(
    enemy.x,
    enemy.z,
    0
  );

  if(!p) return;

  const s=
    Math.max(12,Math.min(100,p.scale*5));

  ctx.fillStyle=enemy.color;

  ctx.fillRect(
    p.x-s*.4,
    p.y-s*2.3,
    s*.8,
    s*2
  );

  ctx.fillStyle="#f0bd92";

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y-s*2.8,
    s*.45,
    0,
    Math.PI*2
  );

  ctx.fill();

}


function drawItem(item){

  const p=project(
    item.x,
    item.z,
    0
  );

  if(!p) return;

  const s=
    Math.max(8,Math.min(50,p.scale*2.5));

  ctx.fillStyle =
    item.type==="med"
    ? "#31e875"
    : "#f1c433";

  ctx.fillRect(
    p.x-s,
    p.y-s,
    s*2,
    s*2
  );

}


function drawBuildingPiece(b){

  const p=project(
    b.x,
    b.z,
    0
  );

  if(!p) return;

  const s=
    Math.max(12,Math.min(90,p.scale*5));

  ctx.fillStyle="#b77a43";

  ctx.fillRect(
    p.x-s,
    p.y-s*2,
    s*2,
    s*2
  );

}


/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(){

  /*
    三人称なのでプレイヤーを画面中央より
    少し下に表示。
  */

  const w=window.innerWidth;
  const h=window.innerHeight;

  const x=w/2;
  const y=h*.68;

  const scale=
    Math.max(
      .8,
      Math.min(
        1.5,
        1+player.y*.02
      )
    );

  ctx.fillStyle="#2466db";

  ctx.beginPath();

  ctx.roundRect(
    x-35*scale,
    y-110*scale,
    70*scale,
    125*scale,
    20*scale
  );

  ctx.fill();

  ctx.fillStyle="#ffc493";

  ctx.beginPath();

  ctx.arc(
    x,
    y-125*scale,
    35*scale,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* gun */

  ctx.fillStyle="#202020";

  ctx.fillRect(
    x+30*scale,
    y-70*scale,
    90*scale,
    18*scale
  );

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  drawSky();

  drawGround();

  /*
    far objects
  */

  const objects=[];

  for(let x=-1400;x<=1400;x+=180){

    for(let z=-1400;z<=1400;z+=220){

      if(
        Math.abs(x-player.x)<1400 &&
        Math.abs(z-player.z)<1400
      ){

        objects.push({
          type:"tree",
          x,
          z
        });

      }

    }

  }

  objects.sort((a,b)=>{

    const da =
      (a.x-player.x)**2+
      (a.z-player.z)**2;

    const db =
      (b.x-player.x)**2+
      (b.z-player.z)**2;

    return db-da;

  });

  objects.forEach(o=>{
    drawTree(o.x,o.z);
  });


  /* buildings */

  for(let x=-1000;x<=1000;x+=500){

    for(let z=-1000;z<=1000;z+=500){

      drawBuilding(x,z);

    }

  }


  /* items */

  items.forEach(drawItem);

  /* enemies */

  enemies
    .slice()
    .sort((a,b)=>{

      const da =
        (a.x-player.x)**2+
        (a.z-player.z)**2;

      const db =
        (b.x-player.x)**2+
        (b.z-player.z)**2;

      return db-da;

    })
    .forEach(drawEnemy);


  /* buildings */

  buildings.forEach(drawBuildingPiece);

  drawPlayer();

}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(){

  requestAnimationFrame(loop);

  if(gameRunning){

    updatePlayer();

    updateGamepad();

    updateEnemies();

    updateBullets();

    updateItems();

    updateStorm();

    updateHUD();

    if(player.hp<=0){

      gameRunning=false;

      showResult();

    }

    if(enemies.length===0){

      gameRunning=false;

      showResult();

    }

  }

  render();

}


/* =========================================================
   RESULT
========================================================= */

function showResult(){

  document
    .getElementById("resultScreen")
    .classList.remove("hidden");

}


document
  .getElementById("returnLobby")
  .addEventListener("click",function(){

    document
      .getElementById("resultScreen")
      .classList.add("hidden");

    showLobby();

  });


/* =========================================================
   INITIAL
========================================================= */

loop();

</script>
