<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Battle Island</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#000;
}

canvas{
  display:block;
}

#lobby{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 30%,#4db9ff,#1265a3 55%,#071b31);
  color:white;
}

.lobbyBox{
  width:min(700px,90vw);
  padding:45px;
  text-align:center;
  background:rgba(5,15,30,.82);
  border:2px solid rgba(255,255,255,.25);
  border-radius:25px;
  box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.title{
  font-size:64px;
  font-weight:900;
  letter-spacing:5px;
  text-shadow:0 8px 20px #000;
}

.subtitle{
  opacity:.8;
  margin-bottom:35px;
}

button{
  border:0;
  border-radius:12px;
  padding:15px 35px;
  margin:8px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

.play{
  background:#22c55e;
  color:white;
  box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.settings{
  background:#334155;
  color:white;
}

#gameUI{
  display:none;
}

.panel{
  position:fixed;
  z-index:5;
  background:rgba(7,18,30,.86);
  color:white;
  border:1px solid rgba(255,255,255,.15);
  border-radius:14px;
  box-shadow:0 8px 25px rgba(0,0,0,.35);
}

#hpPanel{
  left:18px;
  top:18px;
  width:310px;
  padding:14px 18px;
}

.hpText{
  font-size:21px;
  font-weight:bold;
}

.hpBack{
  width:100%;
  height:25px;
  margin-top:7px;
  background:#111;
  border:2px solid white;
  border-radius:10px;
  overflow:hidden;
}

#hpBar{
  height:100%;
  width:100%;
  background:#22c55e;
}

#countPanel{
  right:18px;
  top:18px;
  padding:15px 22px;
  font-size:20px;
  font-weight:bold;
}

#crosshair{
  position:fixed;
  z-index:6;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:30px;
  height:30px;
  pointer-events:none;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
  box-shadow:0 0 3px #000;
}

#crosshair:before{
  width:3px;
  height:30px;
  left:13px;
}

#crosshair:after{
  width:30px;
  height:3px;
  top:13px;
}

#weaponPanel{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:5;
  color:white;
  background:rgba(7,18,30,.9);
  padding:16px 24px;
  border-radius:15px;
  text-align:center;
}

.weaponName{
  font-size:24px;
  font-weight:bold;
}

.ammo{
  font-size:30px;
}

#help{
  position:fixed;
  left:18px;
  bottom:18px;
  z-index:5;
  color:white;
  background:rgba(5,20,15,.85);
  padding:13px;
  border-radius:10px;
  font-size:14px;
  line-height:1.7;
}

#stormText{
  position:fixed;
  left:50%;
  top:18px;
  transform:translateX(-50%);
  z-index:6;
  color:white;
  font-size:18px;
  font-weight:bold;
  background:rgba(40,20,70,.85);
  padding:10px 18px;
  border-radius:10px;
}

#message{
  position:fixed;
  left:50%;
  top:28%;
  transform:translate(-50%,-50%);
  z-index:10;
  color:white;
  font-size:40px;
  font-weight:900;
  text-shadow:0 5px 20px #000;
  text-align:center;
  pointer-events:none;
}

#result{
  display:none;
  position:fixed;
  inset:0;
  z-index:30;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.75);
  color:white;
  text-align:center;
}

.resultBox{
  padding:50px;
  background:rgba(8,20,35,.95);
  border-radius:25px;
  border:2px solid white;
}

#resultTitle{
  font-size:65px;
  font-weight:900;
  margin-bottom:20px;
}

#gameOverText{
  font-size:24px;
  margin-bottom:25px;
}

.damage{
  position:fixed;
  z-index:9;
  color:#ff4444;
  font-size:22px;
  font-weight:bold;
  pointer-events:none;
  animation:damage .7s forwards;
}

@keyframes damage{
  from{
    transform:translateY(0);
    opacity:1;
  }
  to{
    transform:translateY(-70px);
    opacity:0;
  }
}
</style>
</head>

<body>

<div id="lobby">
  <div class="lobbyBox">
    <div class="title">BATTLE ISLAND</div>
    <div class="subtitle">
      OFFLINE BATTLE ROYALE
    </div>

    <div>
      🧍 プレイヤー　🤖 BOT × 9
    </div>

    <button class="play" id="playButton">
      ▶ PLAY
    </button>

    <button class="settings" id="settingsButton">
      ⚙ 設定
    </button>

    <p id="settingsText" style="display:none">
      マウス感度：標準<br>
      グラフィック：高<br>
      ゲームパッド：対応
    </p>
  </div>
</div>

<div id="gameUI">

  <div id="hpPanel" class="panel">
    <div class="hpText">❤️ HP <span id="hpText">100 / 100</span></div>
    <div class="hpBack">
      <div id="hpBar"></div>
    </div>
  </div>

  <div id="countPanel" class="panel">
    👥 残り <span id="remaining">10</span>
  </div>

  <div id="stormText">
    🌀 ストームまで <span id="stormTimer">90</span>秒
  </div>

  <div id="crosshair"></div>

  <div id="message"></div>

  <div id="weaponPanel">
    <div class="weaponName" id="weaponName">🔫 RIFLE</div>
    <div class="ammo">
      <span id="ammo">30</span> / <span id="reserve">120</span>
    </div>
  </div>

  <div id="help">
    WASD：移動<br>
    SHIFT：ダッシュ<br>
    SPACE：ジャンプ<br>
    左クリック：射撃<br>
    R：リロード<br>
    1：ライフル　2：ショットガン<br>
    B：建築モード<br>
    E：アイテム取得<br>
    ESC：ロビー<br>
    🎮 右スティック：カメラ
  </div>

</div>

<div id="result">
  <div class="resultBox">
    <div id="resultTitle">VICTORY!</div>
    <div id="gameOverText"></div>
    <button class="play" id="backLobby">
      🔄 ロビーへ戻る
    </button>
  </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* =========================================================
   基本
========================================================= */

let scene;
let camera;
let renderer;
let clock;

let player;
let playerBody;
let playerHead;

let playing=false;
let gameEnded=false;

let hp=100;
let maxHP=100;

let ammo=30;
let reserveAmmo=120;

let weapon="rifle";

let keys={};

let yaw=0;
let pitch=0.35;

let velocityY=0;
let grounded=true;

let sprint=false;

let buildMode=false;
let buildType=0;

let bullets=[];
let enemies=[];
let pickups=[];
let buildings=[];

let stormRadius=170;
let stormTimer=90;

let mouseDown=false;

let gamepad=null;

/* =========================================================
   DOM
========================================================= */

const lobby=document.getElementById("lobby");
const gameUI=document.getElementById("gameUI");
const result=document.getElementById("result");

const hpText=document.getElementById("hpText");
const hpBar=document.getElementById("hpBar");

const ammoText=document.getElementById("ammo");
const reserveText=document.getElementById("reserve");

const weaponName=document.getElementById("weaponName");

const remaining=document.getElementById("remaining");

const stormText=document.getElementById("stormTimer");

const message=document.getElementById("message");

/* =========================================================
   THREE 初期化
========================================================= */

function init(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x72c8ff);

  scene.fog=new THREE.Fog(0x72c8ff,90,420);

  camera=new THREE.PerspectiveCamera(
    70,
    innerWidth/innerHeight,
    .1,
    700
  );

  renderer=new THREE.WebGLRenderer({
    antialias:true
  });

  renderer.setSize(innerWidth,innerHeight);

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
  );

  renderer.shadowMap.enabled=true;

  document.body.appendChild(renderer.domElement);

  clock=new THREE.Clock();

  /* 光 */

  const hemi=new THREE.HemisphereLight(
    0xffffff,
    0x557755,
    1.5
  );

  scene.add(hemi);

  const sun=new THREE.DirectionalLight(
    0xffffff,
    2
  );

  sun.position.set(100,180,100);
  sun.castShadow=true;

  sun.shadow.mapSize.width=2048;
  sun.shadow.mapSize.height=2048;

  scene.add(sun);

  createWorld();

  createPlayer();

  createEnemies();

  createPickups();

  window.addEventListener("resize",resize);

  document.addEventListener(
    "keydown",
    keyDown
  );

  document.addEventListener(
    "keyup",
    e=>keys[e.code]=false
  );

  document.addEventListener(
    "mousedown",
    e=>{
      if(e.button===0){
        mouseDown=true;
      }
    }
  );

  document.addEventListener(
    "mouseup",
    e=>{
      if(e.button===0){
        mouseDown=false;
      }
    }
  );

  renderer.domElement.addEventListener(
    "click",
    ()=>{
      if(playing){
        renderer.domElement.requestPointerLock();
      }
    }
  );

  document.addEventListener(
    "mousemove",
    e=>{
      if(
        document.pointerLockElement===
        renderer.domElement
      ){
        yaw-=e.movementX*.0025;
        pitch-=e.movementY*.0025;

        pitch=Math.max(
          -0.2,
          Math.min(1.1,pitch)
        );
      }
    }
  );

  animate();
}

/* =========================================================
   ワールド
========================================================= */

function createWorld(){

  /* 地面 */

  const groundGeo=new THREE.PlaneGeometry(
    500,
    500
  );

  const groundMat=new THREE.MeshStandardMaterial({
    color:0x4f9f3d,
    roughness:1
  });

  const ground=new THREE.Mesh(
    groundGeo,
    groundMat
  );

  ground.rotation.x=-Math.PI/2;
  ground.receiveShadow=true;

  scene.add(ground);

  /* 道路 */

  for(let i=-2;i<=2;i++){

    const roadGeo=
      new THREE.BoxGeometry(
        500,
        .15,
        12
      );

    const roadMat=
      new THREE.MeshStandardMaterial({
        color:0x343a40
      });

    const road=new THREE.Mesh(
      roadGeo,
      roadMat
    );

    road.position.set(
      0,
      .07,
      i*65
    );

    road.receiveShadow=true;

    scene.add(road);

  }

  /* 木 */

  for(let i=0;i<85;i++){

    let x=(Math.random()-.5)*420;
    let z=(Math.random()-.5)*420;

    if(Math.abs(z)<35) continue;

    createTree(x,z);

  }

  /* 岩 */

  for(let i=0;i<45;i++){

    let x=(Math.random()-.5)*420;
    let z=(Math.random()-.5)*420;

    createRock(x,z);

  }

  /* 建物 */

  const locations=[
    [-90,-70],
    [100,-80],
    [-100,80],
    [90,80],
    [0,-125],
    [0,125]
  ];

  locations.forEach(
    p=>createBuilding(p[0],p[1])
  );

  /* 中央広場 */

  const plazaGeo=
    new THREE.CylinderGeometry(
      25,
      25,
      .2,
      32
    );

  const plazaMat=
    new THREE.MeshStandardMaterial({
      color:0x777777
    });

  const plaza=new THREE.Mesh(
    plazaGeo,
    plazaMat
  );

  plaza.position.y=.1;

  scene.add(plaza);

}

/* =========================================================
   木
========================================================= */

function createTree(x,z){

  const group=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(
      1.2,
      1.5,
      7,
      8
    ),
    new THREE.MeshStandardMaterial({
      color:0x70482a
    })
  );

  trunk.position.y=3.5;
  trunk.castShadow=true;

  group.add(trunk);

  for(let i=0;i<3;i++){

    const leaf=new THREE.Mesh(
      new THREE.ConeGeometry(
        5.5-i*.8,
        8,
        8
      ),
      new THREE.MeshStandardMaterial({
        color:0x176b32
      })
    );

    leaf.position.y=7+i*3;
    leaf.castShadow=true;

    group.add(leaf);

  }

  group.position.set(x,0,z);

  scene.add(group);
}

/* =========================================================
   岩
========================================================= */

function createRock(x,z){

  const rock=new THREE.Mesh(
    new THREE.DodecahedronGeometry(
      2+Math.random()*3,
      0
    ),
    new THREE.MeshStandardMaterial({
      color:0x666666,
      roughness:1
    })
  );

  rock.position.set(
    x,
    1.5,
    z
  );

  rock.rotation.y=Math.random()*6;

  rock.castShadow=true;

  scene.add(rock);
}

/* =========================================================
   建物
========================================================= */

function createBuilding(x,z){

  const group=new THREE.Group();

  const wallMat=
    new THREE.MeshStandardMaterial({
      color:0xb2764d
    });

  const roofMat=
    new THREE.MeshStandardMaterial({
      color:0x583a2c
    });

  const wall=new THREE.Mesh(
    new THREE.BoxGeometry(
      28,
      12,
      22
    ),
    wallMat
  );

  wall.position.y=6;
  wall.castShadow=true;

  group.add(wall);

  const roof=new THREE.Mesh(
    new THREE.ConeGeometry(
      20,
      8,
      4
    ),
    roofMat
  );

  roof.position.y=16;
  roof.rotation.y=Math.PI/4;
  roof.castShadow=true;

  group.add(roof);

  /* ドア */

  const door=new THREE.Mesh(
    new THREE.BoxGeometry(
      4,
      7,
      .4
    ),
    new THREE.MeshStandardMaterial({
      color:0x2d211b
    })
  );

  door.position.set(
    0,
    3.5,
    11.1
  );

  group.add(door);

  group.position.set(x,0,z);

  scene.add(group);
}

/* =========================================================
   プレイヤー
========================================================= */

function createPlayer(){

  player=new THREE.Group();

  /* 胴体 */

  playerBody=new THREE.Mesh(
    new THREE.CapsuleGeometry(
      1.4,
      3.2,
      5,
      10
    ),
    new THREE.MeshStandardMaterial({
      color:0x2563eb
    })
  );

  playerBody.position.y=3;

  playerBody.castShadow=true;

  player.add(playerBody);

  /* 頭 */

  playerHead=new THREE.Mesh(
    new THREE.SphereGeometry(
      1.15,
      16,
      16
    ),
    new THREE.MeshStandardMaterial({
      color:0xffc49a
    })
  );

  playerHead.position.y=5.6;

  playerHead.castShadow=true;

  player.add(playerHead);

  /* 武器 */

  const gun=new THREE.Mesh(
    new THREE.BoxGeometry(
      .5,
      .5,
      3
    ),
    new THREE.MeshStandardMaterial({
      color:0x222222
    })
  );

  gun.position.set(
    1.4,
    3.5,
    -1.2
  );

  gun.rotation.x=-.15;

  player.add(gun);

  player.position.set(
    0,
    0,
    0
  );

  scene.add(player);
}

/* =========================================================
   敵
========================================================= */

function createEnemies(){

  for(let i=0;i<9;i++){

    const enemy=new THREE.Group();

    const body=new THREE.Mesh(
      new THREE.CapsuleGeometry(
        1.3,
        3,
        5,
        10
      ),
      new THREE.MeshStandardMaterial({
        color:
          new THREE.Color().setHSL(
            Math.random(),
            .7,
            .5
          )
      })
    );

    body.position.y=3;
    body.castShadow=true;

    enemy.add(body);

    const head=new THREE.Mesh(
      new THREE.SphereGeometry(
        1.1,
        14,
        14
      ),
      new THREE.MeshStandardMaterial({
        color:0xffc49a
      })
    );

    head.position.y=5.5;

    enemy.add(head);

    enemy.position.set(
      (Math.random()-.5)*250,
      0,
      (Math.random()-.5)*250
    );

    scene.add(enemy);

    enemies.push({
      mesh:enemy,
      hp:100,
      speed:3+Math.random()*1.5,
      attackTimer:Math.random()*3,
      alive:true
    });

  }

}

/* =========================================================
   アイテム
========================================================= */

function createPickups(){

  const items=[
    {
      type:"rifle",
      x:25,
      z:15
    },
    {
      type:"shotgun",
      x:-35,
      z:40
    },
    {
      type:"medkit",
      x:60,
      z:-35
    },
    {
      type:"ammo",
      x:-50,
      z:-30
    }
  ];

  items.forEach(item=>{

    let color=0xffff00;

    if(item.type==="rifle")
      color=0x22c55e;

    if(item.type==="shotgun")
      color=0xef4444;

    if(item.type==="medkit")
      color=0xffffff;

    if(item.type==="ammo")
      color=0xfacc15;

    const mesh=new THREE.Mesh(
      new THREE.BoxGeometry(
        2,
        2,
        2
      ),
      new THREE.MeshStandardMaterial({
        color,
        emissive:color,
        emissiveIntensity:.15
      })
    );

    mesh.position.set(
      item.x,
      1.5,
      item.z
    );

    mesh.castShadow=true;

    scene.add(mesh);

    pickups.push({
      mesh,
      type:item.type
    });

  });

}

/* =========================================================
   入力
========================================================= */

function keyDown(e){

  keys[e.code]=true;

  if(e.code==="ShiftLeft"||
     e.code==="ShiftRight"){

    sprint=true;

  }

  if(e.code==="Space"){
    jump();
  }

  if(e.code==="KeyR"){
    reload();
  }

  if(e.code==="Digit1"){
    weapon="rifle";
    updateWeapon();
  }

  if(e.code==="Digit2"){
    weapon="shotgun";
    updateWeapon();
  }

  if(e.code==="KeyB"){
    buildMode=!buildMode;

    showMessage(
      buildMode?
      "🏗️ 建築モード":
      "🔫 戦闘モード"
    );

  }

  if(e.code==="KeyE"){
    pickupItem();
  }

  if(e.code==="Escape"){
    goLobby();
  }

}

/* =========================================================
   ジャンプ
========================================================= */

function jump(){

  if(grounded){

    velocityY=11;
    grounded=false;

  }

}

/* =========================================================
   移動
========================================================= */

function updatePlayer(dt){

  if(!playing) return;

  const direction=new THREE.Vector3();

  if(keys.KeyW) direction.z-=1;
  if(keys.KeyS) direction.z+=1;
  if(keys.KeyA) direction.x-=1;
  if(keys.KeyD) direction.x+=1;

  if(direction.length()>0){

    direction.normalize();

    const speed=
      sprint?12:6;

    const forward=
      new THREE.Vector3(
        Math.sin(yaw),
        0,
        Math.cos(yaw)
      );

    const right=
      new THREE.Vector3(
        Math.cos(yaw),
        0,
        -Math.sin(yaw)
      );

    const move=new THREE.Vector3();

    move.addScaledVector(
      forward,
      -direction.z
    );

    move.addScaledVector(
      right,
      direction.x
    );

    player.position.addScaledVector(
      move,
      speed*dt
    );

    player.rotation.y=
      Math.atan2(
        move.x,
        move.z
      );

  }

  /* 重力 */

  velocityY-=25*dt;

  player.position.y+=velocityY*dt;

  if(player.position.y<=0){

    player.position.y=0;
    velocityY=0;
    grounded=true;

  }

  /* マップ外 */

  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -235,
      235
    );

  player.position.z=
    THREE.MathUtils.clamp(
      player.position.z,
      -235,
      235
    );

}

/* =========================================================
   カメラ
========================================================= */

function updateCamera(){

  if(!player) return;

  const distance=11;

  const target=new THREE.Vector3(
    player.position.x,
    player.position.y+4,
    player.position.z
  );

  const offset=new THREE.Vector3(
    Math.sin(yaw)*distance,
    5+pitch*3,
    Math.cos(yaw)*distance
  );

  camera.position.copy(
    target.clone().add(offset)
  );

  camera.lookAt(target);

}

/* =========================================================
   ゲームパッド
========================================================= */

function updateGamepad(){

  const pads=navigator.getGamepads?.();

  if(!pads) return;

  gamepad=pads[0];

  if(!gamepad) return;

  const lx=gamepad.axes[0]||0;
  const ly=gamepad.axes[1]||0;

  if(Math.abs(lx)>.15)
    keys.KeyD=lx>.15,
    keys.KeyA=lx<-.15;

  if(Math.abs(ly)>.15)
    keys.KeyS=ly>.15,
    keys.KeyW=ly<-.15;

  /* 右スティック */

  const rx=gamepad.axes[2]||0;
  const ry=gamepad.axes[3]||0;

  if(Math.abs(rx)>.08)
    yaw-=rx*.045;

  if(Math.abs(ry)>.08)
    pitch-=ry*.025;

  pitch=THREE.MathUtils.clamp(
    pitch,
    -.2,
    1.1
  );

  /* A */

  if(gamepad.buttons[0]?.pressed){
    jump();
  }

  /* R2 */

  if(gamepad.buttons[7]?.pressed){
    shoot();
  }

  /* B */

  if(gamepad.buttons[1]?.pressed){
    buildMode=true;
  }

}

/* =========================================================
   射撃
========================================================= */

let lastShot=0;

function shoot(){

  if(!playing||gameEnded) return;

  const now=performance.now();

  const cooldown=
    weapon==="rifle"?110:500;

  if(now-lastShot<cooldown) return;

  lastShot=now;

  if(ammo<=0){

    reload();
    return;

  }

  ammo--;

  updateAmmo();

  const origin=
    camera.getWorldPosition(
      new THREE.Vector3()
    );

  const direction=
    new THREE.Vector3();

  camera.getWorldDirection(
    direction
  );

  const ray=
    new THREE.Raycaster(
      origin,
      direction,
      0,
      300
    );

  const objects=
    enemies
      .filter(e=>e.alive)
      .map(e=>e.mesh);

  const hits=
    ray.intersectObjects(
      objects,
      true
    );

  if(hits.length){

    let hit=hits[0].object;

    while(
      hit.parent &&
      !enemies.some(
        e=>e.mesh===hit
      )
    ){
      hit=hit.parent;
    }

    const enemy=
      enemies.find(
        e=>
          e.mesh===hit||
          e.mesh.children.includes(hit)
      );

    if(enemy){

      const damage=
        weapon==="rifle"?25:65;

      enemy.hp-=damage;

      showDamage(
        hits[0].point,
        damage
      );

      if(enemy.hp<=0){

        enemy.alive=false;

        scene.remove(enemy.mesh);

        updateRemaining();

      }

    }

  }

  /* 弾エフェクト */

  createTracer(
    origin,
    direction
  );

}

/* =========================================================
   弾道
========================================================= */

function createTracer(origin,direction){

  const length=70;

  const geo=
    new THREE.CylinderGeometry(
      .04,
      .04,
      length,
      6
    );

  const mat=
    new THREE.MeshBasicMaterial({
      color:0xffff88
    });

  const mesh=
    new THREE.Mesh(
      geo,
      mat
    );

  mesh.position.copy(origin);

  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    direction
  );

  mesh.translateY(length/2);

  scene.add(mesh);

  setTimeout(
    ()=>scene.remove(mesh),
    70
  );

}

/* =========================================================
   敵AI
========================================================= */

function updateEnemies(dt){

  if(!playing) return;

  enemies.forEach(enemy=>{

    if(!enemy.alive) return;

    const pos=enemy.mesh.position;

    const distance=
      pos.distanceTo(
        player.position
      );

    if(distance<80){

      const dir=
        player.position
          .clone()
          .sub(pos);

      dir.y=0;

      if(dir.length()>8){

        dir.normalize();

        pos.addScaledVector(
          dir,
          enemy.speed*dt
        );

        enemy.mesh.rotation.y=
          Math.atan2(
            dir.x,
            dir.z
          );

      }

      enemy.attackTimer-=dt;

      if(
        distance<45 &&
        enemy.attackTimer<=0
      ){

        enemy.attackTimer=
          1.5+Math.random();

        damagePlayer(
          5+Math.floor(Math.random()*7)
        );

      }

    }

  });

}

/* =========================================================
   プレイヤーダメージ
========================================================= */

function damagePlayer(amount){

  if(gameEnded) return;

  hp-=amount;

  hp=Math.max(
    0,
    hp
  );

  updateHP();

  if(hp<=0){

    endGame(false);

  }

}

/* =========================================================
   HP
========================================================= */

function updateHP(){

  hpText.textContent=
    `${Math.ceil(hp)} / ${maxHP}`;

  hpBar.style.width=
    `${hp}%`;

  if(hp<30){

    hpBar.style.background=
      "#ef4444";

  }else if(hp<60){

    hpBar.style.background=
      "#facc15";

  }else{

    hpBar.style.background=
      "#22c55e";

  }

}

/* =========================================================
   武器
========================================================= */

function updateWeapon(){

  if(weapon==="rifle"){

    weaponName.textContent=
      "🔫 RIFLE";

  }else{

    weaponName.textContent=
      "💥 SHOTGUN";

  }

}

/* =========================================================
   弾
========================================================= */

function updateAmmo(){

  ammoText.textContent=ammo;
  reserveText.textContent=
    reserveAmmo;

}

function reload(){

  if(
    ammo>=30 ||
    reserveAmmo<=0
  ) return;

  const amount=
    Math.min(
      30-ammo,
      reserveAmmo
    );

  ammo+=amount;
  reserveAmmo-=amount;

  updateAmmo();

  showMessage("🔄 RELOAD");

}

/* =========================================================
   アイテム取得
========================================================= */

function pickupItem(){

  let closest=null;
  let distance=999;

  pickups.forEach(item=>{

    const d=
      player.position.distanceTo(
        item.mesh.position
      );

    if(d<5 && d<distance){

      closest=item;
      distance=d;

    }

  });

  if(!closest){

    showMessage("近くにアイテムがありません");

    return;
  }

  if(closest.type==="rifle"){

    weapon="rifle";

  }

  if(closest.type==="shotgun"){

    weapon="shotgun";

  }

  if(closest.type==="medkit"){

    hp=Math.min(
      maxHP,
      hp+40
    );

    updateHP();

  }

  if(closest.type==="ammo"){

    reserveAmmo+=60;

    updateAmmo();

  }

  scene.remove(
    closest.mesh
  );

  pickups=
    pickups.filter(
      x=>x!==closest
    );

  updateWeapon();

  showMessage(
    "🎒 ITEM GET!"
  );

}

/* =========================================================
   建築
========================================================= */

function build(){

  if(!buildMode) return;

  const distance=7;

  const pos=
    player.position.clone();

  const forward=
    new THREE.Vector3(
      Math.sin(yaw),
      0,
      Math.cos(yaw)
    );

  pos.addScaledVector(
    forward,
    -distance
  );

  pos.y=2.5;

  let mesh;

  if(buildType===0){

    mesh=new THREE.Mesh(
      new THREE.BoxGeometry(
        7,
        5,
        .5
      ),
      new THREE.MeshStandardMaterial({
        color:0x60a5fa,
        transparent:true,
        opacity:.85
      })
    );

  }

  if(buildType===1){

    mesh=new THREE.Mesh(
      new THREE.BoxGeometry(
        7,
        .4,
        7
      ),
      new THREE.MeshStandardMaterial({
        color:0x60a5fa,
        transparent:true,
        opacity:.85
      })
    );

    pos.y=5;

  }

  if(buildType===2){

    mesh=new THREE.Mesh(
      new THREE.BoxGeometry(
        7,
        .5,
        9
      ),
      new THREE.MeshStandardMaterial({
        color:0x60a5fa,
        transparent:true,
        opacity:.85
      })
    );

    mesh.rotation.x=
      -Math.PI/6;

  }

  mesh.position.copy(pos);

  scene.add(mesh);

  buildings.push(mesh);

  if(buildings.length>30){

    scene.remove(
      buildings.shift()
    );

  }

}

/* =========================================================
   ストーム
========================================================= */

let stormMesh;

function createStorm(){

  const geo=
    new THREE.RingGeometry(
      stormRadius-1,
      stormRadius,
      128
    );

  const mat=
    new THREE.MeshBasicMaterial({
      color:0xa855f7,
      transparent:true,
      opacity:.75,
      side:THREE.DoubleSide
    });

  stormMesh=
    new THREE.Mesh(
      geo,
      mat
    );

  stormMesh.rotation.x=
    -Math.PI/2;

  stormMesh.position.y=.5;

  scene.add(stormMesh);

}

function updateStorm(dt){

  stormTimer-=dt;

  if(stormTimer<=0){

    stormTimer=60;

    stormRadius=
      Math.max(
        20,
        stormRadius-18
      );

    scene.remove(
      stormMesh
    );

    createStorm();

  }

  stormText.textContent=
    Math.ceil(stormTimer);

  const d=Math.sqrt(
    player.position.x**2+
    player.position.z**2
  );

  if(d>stormRadius){

    damagePlayer(
      5*dt
    );

  }

}

/* =========================================================
   残り人数
========================================================= */

function updateRemaining(){

  const alive=
    enemies.filter(
      e=>e.alive
    ).length;

  remaining.textContent=
    alive+1;

  if(alive===0){

    endGame(true);

  }

}

/* =========================================================
   ダメージ表示
========================================================= */

function showDamage(point,damage){

  const div=
    document.createElement("div");

  div.className="damage";

  div.textContent=
    `-${damage}`;

  div.style.left=
    `${50+Math.random()*10-5}%`;

  div.style.top=
    `${45+Math.random()*10-5}%`;

  document.body.appendChild(div);

  setTimeout(
    ()=>div.remove(),
    700
  );

}

/* =========================================================
   メッセージ
========================================================= */

let messageTimer;

function showMessage(text){

  message.textContent=text;

  clearTimeout(messageTimer);

  messageTimer=setTimeout(
    ()=>{
      message.textContent="";
    },
    1300
  );

}

/* =========================================================
   ゲーム開始
========================================================= */

function startGame(){

  lobby.style.display="none";
  result.style.display="none";
  gameUI.style.display="block";

  playing=true;
  gameEnded=false;

  hp=100;

  ammo=30;
  reserveAmmo=120;

  stormRadius=170;
  stormTimer=90;

  enemies.forEach(
    e=>{
      if(!e.alive){
        scene.add(e.mesh);
      }

      e.alive=true;
      e.hp=100;

      e.mesh.position.set(
        (Math.random()-.5)*250,
        0,
        (Math.random()-.5)*250
      );
    }
  );

  player.position.set(
    0,
    0,
    0
  );

  updateHP();
  updateAmmo();
  updateWeapon();
  updateRemaining();

  createStorm();

  showMessage(
    "🏝️ BATTLE START!"
  );

}

/* =========================================================
   ゲーム終了
========================================================= */

function endGame(win){

  if(gameEnded) return;

  gameEnded=true;
  playing=false;

  result.style.display="flex";

  if(win){

    document.getElementById(
      "resultTitle"
    ).textContent=
      "🏆 VICTORY!";

    document.getElementById(
      "gameOverText"
    ).textContent=
      "最後まで生き残りました！";

  }else{

    document.getElementById(
      "resultTitle"
    ).textContent=
      "💀 GAME OVER";

    document.getElementById(
      "gameOverText"
    ).textContent=
      "もう一度チャレンジしよう！";

  }

}

/* =========================================================
   ロビー
========================================================= */

function goLobby(){

  playing=false;

  lobby.style.display="flex";
  gameUI.style.display="none";
  result.style.display="none";

}

/* =========================================================
   メインループ
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  const dt=Math.min(
    clock.getDelta(),
    .05
  );

  updateGamepad();

  if(playing){

    updatePlayer(dt);

    updateEnemies(dt);

    updateStorm(dt);

    updateCamera();

    if(mouseDown){
      shoot();
    }

    if(buildMode && keys.KeyB){
      build();
    }

  }

  renderer.render(
    scene,
    camera
  );

}

/* =========================================================
   ボタン
========================================================= */

document.getElementById(
  "playButton"
).onclick=()=>{

  startGame();

};

document.getElementById(
  "settingsButton"
).onclick=()=>{

  const t=
    document.getElementById(
      "settingsText"
    );

  t.style.display=
    t.style.display==="none"
    ?"block"
    :"none";

};

document.getElementById(
  "backLobby"
).onclick=()=>{

  goLobby();

};

/* =========================================================
   建築キー
========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(e.code==="KeyV"){
      buildType=0;
      build();
    }

    if(e.code==="KeyF"){
      buildType=1;
      build();
    }

    if(e.code==="KeyG"){
      buildType=2;
      build();
    }

  }
);

/* =========================================================
   リサイズ
========================================================= */

function resize(){

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

}

/* =========================================================
   開始
========================================================= */

init();

</script>
